name: Deploy site to GitHub Pages

# Deploys BOTH outputs/ and readable/ to GitHub Pages, so every surface has a
# permanent public URL and the comprehensive card hub (outputs/index.html) is
# the site landing page:
#   https://jroypeterson.github.io/macro-monitor/                  (card hub — landing)
#   https://jroypeterson.github.io/macro-monitor/dashboard/        (outputs/)
#   https://jroypeterson.github.io/macro-monitor/calendar/...      (outputs/)
#   https://jroypeterson.github.io/macro-monitor/international/     (outputs/)
#   https://jroypeterson.github.io/macro-monitor/fiscal/           (readable/)
#   https://jroypeterson.github.io/macro-monitor/drug_prices/      (readable/)
#   https://jroypeterson.github.io/macro-monitor/market/           (readable/)
#   https://jroypeterson.github.io/macro-monitor/ahead_of_curve/   (readable/)
#
# Staging merges readable/ then outputs/ into _site (outputs/index.html wins as
# the root landing page). Fires on pushes touching outputs/** or readable/** — incl.
# the release/reconcile/calendar cron auto-commits, so the public site stays fresh.
# NOTE: only public, cited data lives here — never deploy positions/account/paid data.

on:
  push:
    branches: [main]
    paths:
      - "outputs/**"
      - "readable/**"
      - ".github/workflows/pages_deploy.yml"
  workflow_dispatch: {}

# Only one Pages deploy at a time; cancel in-progress runs if a new
# commit lands while the previous deploy is still running.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage readable/ + outputs/ into the published site
        # readable/ first (brings the galleries: fiscal, drug_prices, market, ahead_of_curve),
        # then outputs/ — so outputs/index.html wins as the site landing page (the comprehensive
        # card hub with live links to every view). No path collisions besides index.html.
        run: |
          mkdir -p _site
          cp -r readable/. _site/
          cp -r outputs/. _site/

      - name: Upload the staged site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        name: Deploy
        uses: actions/deploy-pages@v4
