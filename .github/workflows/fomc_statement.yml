name: FOMC statement

# Fetches the just-released FOMC statement + the prior one, redlines the
# language changes, tags the decision + lean, and posts to #macro-and-markets.
#
# The gate is in Python (`cli fomc-statement`), not a clock hour: GitHub starts
# this account's scheduled runs 3-4h late, and the old bash ET_HOUR==14 step
# skipped the 2026-09-16 statement on a green run. A run posts when a decision
# day is on/before today (ET) within a 2-day lookback, the statement text is
# non-empty, and state/posts.db has no ('fomc_statement', decision date) row.
# Text not up yet -> exit 1 (red) with no row, so the next run retries.
# Non-decision days exit 0 without fetching anything.

on:
  schedule:
    - cron: "5 18 * * *"   # 14:05 EDT (summer)
    - cron: "5 19 * * *"   # 14:05 EST (winter)
  workflow_dispatch: {}

permissions:
  contents: write   # needed for the git push step

# Deliberately NOT in the macro-posts concurrency group (Fable review 2026-09-17):
# ⛑ BACK IN macro-posts, and the flip-flop is the point — read this before
# moving it again.
#
# Round 1 (Fable) moved FOMC OUT: GitHub keeps only ONE pending run per group,
# so a release poll queued behind a pending FOMC run silently CANCELS it, and
# — its stated premise — "fomc_statement.yml commits no state, so the group
# bought it nothing."
#
# That premise was made FALSE by a later commit on this same branch. This
# workflow now does `git add state/posts.db && git pull --rebase && git push`
# (see the persist step below), so it is a third writer to the same binary
# SQLite file as release_polling and reconciliation. Round 2 (Codex, P1,
# 2026-09-21) caught it: two writers from the same commit both post, the
# loser's rebase hits a binary conflict AFTER Slack already has the message,
# its ledger row dies with the runner, and the next run POSTS AGAIN.
# `prose-outliving-the-artifact-it-describes`, and the comment that used to
# sit here was the prose — it claimed this group "serialises ... so they never
# race the ledger" while serialising FOMC only against ITSELF.
#
# Both hazards are real; they are not equally bad, and the branch changed
# which one costs more:
#
#   Cancelled FOMC run  -> nothing posts at 14:05. The gate is now "owed and
#                          unposted", so the next daily cron posts it, late.
#                          Self-correcting; lateness is what this branch fixes.
#   Lost ledger row     -> a DUPLICATE Fed rate decision in a markets channel.
#                          Wrong output, and the system repeats it rather than
#                          correcting it.
#
# So: serialise. A late post beats a double post. If a future round wants FOMC
# out of this group again, the prerequisite is making the ledger write survive
# a concurrent push (merge the row rather than rebase the file) — not moving
# the workflow.
concurrency:
  group: macro-posts
  cancel-in-progress: false

jobs:
  statement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Set up package import path
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor

      - name: Refresh the ledger from the default branch
        # ⛑ A concurrency group serialises EXECUTION, not the checkout.
        # A run that sat pending keeps the `github.sha` it was queued with, so
        # without this it reads a posts.db from before the previous run's push,
        # concludes the period is unposted, and posts a DUPLICATE -- then loses
        # its own row to the binary rebase below. Serialising made the race
        # rarer, not impossible; this is what closes it.
        # Hard reset rather than a path checkout: the tree is pristine at this
        # point, and it leaves the later `git pull --rebase` with nothing to
        # reconcile instead of a binary conflict it cannot merge.
        run: |
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          git reset --hard FETCH_HEAD

      - name: Post FOMC statement redline
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MACRO_CHANNEL_ID: ${{ secrets.SLACK_MACRO_CHANNEL_ID }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        run: python -m macro_monitor.cli fomc-statement --post

      - name: Persist posts ledger
        # Commit the ledger back so the next run sees this decision as posted.
        # Must run even if the post step failed, mirroring release_polling.yml.
        if: always()
        run: |
          git config user.name "claudebot"
          git config user.email "claudebot@users.noreply.github.com"
          git add state/posts.db outputs/ data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "fomc-statement: $(date -u +%FT%TZ)"
            git pull --rebase --autostash
            git push
          fi
