name: Prediction markets

# Weekly forward-looking crowd-odds rundown to #prediction-markets (Polymarket:
# macro / healthcare-pandemics / biotech FDA-approval catalysts) + refresh the
# readable/prediction_markets panel. Monday 08:00 ET (week-ahead).
# 08:00 EDT = 12:00 UTC, 08:00 EST = 13:00 UTC — both listed for DST.

# ONE cron line and no exact-hour guard. This used to list an EDT and an EST
# line and let only the run that started in the target New York hour act.
# GitHub starts scheduled runs hours late, so both runs landed outside that
# hour, skipped, and reported success -- the lane was silently dead for
# months (found 2026-11-12). A single line cannot double-run.

on:
  schedule:
    - cron: "0 12 * * 1"   # starts hours late; see note above
  workflow_dispatch: {}

jobs:
  pred-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Set up package import path
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor

      - name: Post prediction-market rundown
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PREDMARKET_CHANNEL_ID: ${{ secrets.SLACK_PREDMARKET_CHANNEL_ID }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        run: python -m macro_monitor.cli pred-markets --post

      - name: Commit refreshed prediction-markets panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add readable/prediction_markets/index.html \
                  data/predmarket_history.json data/predmarket_seen.json || true
          git diff --cached --quiet || git commit -m "pred-markets: refresh panel + odds history [skip ci]"
          git push || true
