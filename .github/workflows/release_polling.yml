name: Release polling

# Fires every 15 minutes during a UTC window that covers ET morning
# releases under BOTH EDT (UTC-4) and EST (UTC-5). Every run POLLS: there is
# no ET wall-clock gate any more. GitHub creates this account's scheduled runs
# 3-4h late and drops most (measured Aug-Sep 2026), and the old 8:25-11:00 /
# 13:55-14:35 ET gate made each late run exit green having posted nothing
# (Retail Sales, Industrial Production, Claims missed 2026-09-16/17).
#
# Idempotency comes from state/posts.db: a release that has already been
# posted for a given period won't double-post on the next fire, and a changed
# headline for the same period posts as a REVISION. The concurrency group
# below serialises this lane with reconciliation.yml (both run poll-all --post
# and commit state/posts.db) so two runs never race on the ledger commit.

on:
  schedule:
    # */15 across 11:00–18:59 UTC, Mon–Fri.
    # That covers:
    #   EDT (UTC-4): 7:00–14:59 ET → catches 8:30 BLS/BEA + 10:00 JOLTS + 14:00 FOMC
    #   EST (UTC-5): 6:00–13:59 ET → same coverage
    - cron: "*/15 11-18 * * 1-5"
  workflow_dispatch:
    # Manual trigger for one-off polls (e.g., post-hours catch-up)

permissions:
  contents: write   # needed for the git push step

# Shared with reconciliation.yml. Queue, never cancel: a cancelled run could
# die between the Slack post and the ledger commit, and the next run re-posts.
concurrency:
  group: macro-posts
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up package import path
        # Repo root IS the macro_monitor package; symlink it under that
        # name so `python -m macro_monitor.cli ...` works.
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor

      - name: Refresh the ledger from the default branch
        # ⛑ A concurrency group serialises EXECUTION, not the checkout.
        # A run that sat pending keeps the `github.sha` it was queued with, so
        # without this it reads a posts.db from before the previous run's push,
        # concludes the period is unposted, and posts a DUPLICATE -- then loses
        # its own row to the binary rebase below. Serialising made the race
        # rarer, not impossible; this is what closes it.
        # Hard reset rather than a path checkout: the tree is pristine at this
        # point, and it leaves the later `git pull --rebase` with nothing to
        # reconcile instead of a binary conflict it cannot merge.
        run: |
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          git reset --hard FETCH_HEAD

      - name: Poll Tier A families
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MACRO_CHANNEL_ID: ${{ secrets.SLACK_MACRO_CHANNEL_ID }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        run: |
          python -m macro_monitor.cli poll-all --post

      - name: Persist posts ledger and outputs
        # Commit changes back to the repo so the state survives across runs.
        # The ledger is what makes polling idempotent — without persistence
        # every run would think it was the first time and re-post everything.
        # Must run even if an earlier family raised (poll-all exits 1), else a
        # posted release's ledger row is discarded and next cron re-posts it.
        if: always()
        run: |
          git config user.name "claudebot"
          git config user.email "claudebot@users.noreply.github.com"
          git add state/posts.db outputs/ data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "poll-all: $(date -u +%FT%TZ)"
            git pull --rebase --autostash
            git push
          fi
