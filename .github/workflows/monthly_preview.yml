name: Monthly preview

# Next month's Tier A release table to #macro-and-markets, posted on the LAST
# day of the month (e.g. June 30 -> July's Tier A releases).
#
# Cron cannot say "last day", so this runs on the 28th-31st and the command
# itself acts only when tomorrow (New York date) is the 1st. One cron line, so
# it cannot double-post, and no exact-hour guard: GitHub starts scheduled runs
# hours late, which is what silently killed the weekly preview for 11 weeks.

on:
  schedule:
    - cron: "0 11 28-31 * *"
  workflow_dispatch: {}

jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Set up package import path
        # Repo root IS the macro_monitor package (contains __init__.py).
        # python -m macro_monitor.cli needs a directory NAMED macro_monitor
        # findable on sys.path — symlink the repo into /tmp under that name.
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor


      - name: Post monthly preview (acts only on the last day of the month)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MACRO_CHANNEL_ID: ${{ secrets.SLACK_MACRO_CHANNEL_ID }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        # A manual run posts on any day; a scheduled run is gated by the command.
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then FORCE="--force"; fi
          python -m macro_monitor.cli monthly-preview --post $FORCE
