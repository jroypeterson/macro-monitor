name: Heartbeat

# Daily Tier B heartbeat to #status-reports per HEALTH_REPORTING.md §4.8.
# Fires at 08:00 ET daily — just after the Sunday weekly-preview slot so
# the preview's "did the Sunday post land" question is answered by the
# heartbeat the same morning.

# ONE cron line and no exact-hour guard. This used to list an EDT and an EST
# line and let only the run that started in the target New York hour act.
# GitHub starts scheduled runs hours late, so both runs landed outside that
# hour, skipped, and reported success -- every run checked 2026-11-10..12.
# (Same defect silenced the Sunday preview for 11 weeks.) A single line
# cannot double-run, so it needs no guard.

on:
  schedule:
    - cron: "0 12 * * *"   # 08:00 EDT / 07:00 EST, daily (starts late)
  workflow_dispatch: {}

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Set up package import path
        # Repo root IS the macro_monitor package (contains __init__.py).
        # python -m macro_monitor.cli needs a directory NAMED macro_monitor
        # findable on sys.path — symlink the repo into /tmp under that name.
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor


      - name: Post heartbeat
        env:
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        run: python -m macro_monitor.cli heartbeat --post
