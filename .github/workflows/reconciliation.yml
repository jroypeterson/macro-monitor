name: Reconciliation

# 17:00 ET daily reconciliation pass — catches anything the */15
# release_polling missed during the day, surfaces stale-data warnings
# to #status-reports. Skips the window guard so it runs even though
# 17:00 is outside the morning polling window.

# ONE cron line and no exact-hour guard. This used to list an EDT and an EST
# line and let only the run that started in the 17:00 New York hour act.
# GitHub starts scheduled runs hours late, so both runs landed outside that
# hour, skipped, and reported success -- every run checked 2026-11-10..12.
# (Same defect silenced the Sunday preview for 11 weeks.) A single line
# cannot double-run, so it needs no guard.

on:
  schedule:
    - cron: "0 21 * * 1-5"   # 17:00 EDT / 16:00 EST, Mon-Fri (starts late)
  workflow_dispatch: {}

permissions:
  contents: write   # needed for the git push step

# Same group as release_polling / fomc_statement: this job also runs poll-all --post
# and commits state/posts.db, so with the clock gate gone a late poll could overlap it.
concurrency:
  group: macro-posts
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Set up package import path
        # Repo root IS the macro_monitor package (contains __init__.py).
        # python -m macro_monitor.cli needs a directory NAMED macro_monitor
        # findable on sys.path — symlink the repo into /tmp under that name.
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor


      - name: Refresh the ledger from the default branch
        # ⛑ A concurrency group serialises EXECUTION, not the checkout.
        # A run that sat pending keeps the `github.sha` it was queued with, so
        # without this it reads a posts.db from before the previous run's push,
        # concludes the period is unposted, and posts a DUPLICATE -- then loses
        # its own row to the binary rebase below. Serialising made the race
        # rarer, not impossible; this is what closes it.
        # Hard reset rather than a path checkout: the tree is pristine at this
        # point, and it leaves the later `git pull --rebase` with nothing to
        # reconcile instead of a binary conflict it cannot merge.
        run: |
          git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
          git reset --hard FETCH_HEAD

      - name: Catch-up poll (skips window guard)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MACRO_CHANNEL_ID: ${{ secrets.SLACK_MACRO_CHANNEL_ID }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        run: |
          python -m macro_monitor.cli poll-all --post --skip-window-check

      - name: Persist ledger updates
        # always() (not success()) so a posted release's ledger row survives
        # even when an earlier family raised and poll-all exited 1; otherwise
        # the discarded ledger makes the next run re-post it.
        if: always()
        run: |
          git config user.name "claudebot"
          git config user.email "claudebot@users.noreply.github.com"
          git add state/posts.db outputs/ data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "reconciliation: $(date -u +%FT%TZ)"
            git pull --rebase --autostash
            git push
          fi
