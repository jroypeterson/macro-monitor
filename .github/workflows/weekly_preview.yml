name: Weekly preview

# Sunday week-ahead table to #macro-and-markets (this week, Tier A + B; the
# next-4-weeks Tier A lookahead goes in the thread).
#
# ONE cron line and NO exact-hour guard. The old version listed two lines
# (11:00 and 12:00 UTC) and let only the run that started in the 07:00 ET hour
# post. GitHub starts scheduled runs hours late (3-6h on every Sunday checked),
# so from 2026-08-30 to 2026-11-08 BOTH runs landed outside that hour, skipped,
# and reported success: eleven Sundays with no preview and nothing red. A
# single line cannot double-post, and the guard below only asks "is it still
# Sunday in New York", which a late start cannot fail until ~18h late -- and
# then it FAILS the run rather than skipping quietly.

on:
  schedule:
    - cron: "0 11 * * 0"   # Sunday 07:00 EDT / 06:00 EST (starts late; see above)
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Set up package import path
        # Repo root IS the macro_monitor package (contains __init__.py).
        # python -m macro_monitor.cli needs a directory NAMED macro_monitor
        # findable on sys.path — symlink the repo into /tmp under that name.
        run: |
          mkdir -p /tmp/pkg
          ln -sf "$GITHUB_WORKSPACE" /tmp/pkg/macro_monitor


      - name: Refuse to post on the wrong day
        # Manual runs always post. A scheduled run that started so late it is
        # no longer Sunday in New York fails loudly instead of posting a stale
        # "this week" or skipping in silence.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - posting."
            exit 0
          fi
          ET_DOW=$(TZ=America/New_York date +%u)
          if [ "$ET_DOW" != "7" ]; then
            echo "::error::Weekly preview started on New York weekday $ET_DOW, not Sunday; not posting."
            exit 1
          fi

      - name: Post weekly preview
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MACRO_CHANNEL_ID: ${{ secrets.SLACK_MACRO_CHANNEL_ID }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          PYTHONUTF8: "1"
          PYTHONPATH: /tmp/pkg
        run: python -m macro_monitor.cli weekly-preview --post
