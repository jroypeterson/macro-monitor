  ppi:
    # === Metadata ===
    tier: A
    family_type: numeric
    cadence: monthly
    release_calendar_id: 46            # Producer Price Index
    release_time_et: "08:30"
    source: fred
    fallback_source: bls
    topics: [inflation]

    # === Display ===
    display_name: "PPI"
    period_label_format: "{month_name} {year}"

    # === Headline ===
    # Same inflation pattern as CPI / PCE: display YoY+MoM, anchor on annualized_mom.
    headline:
      - id: PPIFIS
        label: "Headline (Final Demand)"
        primary_transform: annualized_mom
        also_display: [yoy_pct, mom_pct]
        basis: "MoM annualized"
      - id: PPIFES
        label: "Core (Final Demand less Food & Energy)"
        primary_transform: annualized_mom
        also_display: [yoy_pct, mom_pct]
        basis: "MoM annualized"

    # === Components ===
    # HC-investor producer-price cuts: provider output prices (hospitals,
    # physician offices) + manufacturer input/output prices (pharma,
    # surgical/medical instruments). These are NAICS industry PPIs (index
    # levels) so YoY is the meaningful read. They map to the coverage
    # universe's Healthcare Services / Biopharma / MedTech sectors.
    components:
      - id: PCU622622
        label: "Hospitals PPI"
        primary_transform: yoy_pct
        tags: [healthcare]
      - id: PCU621111621111
        label: "Physician offices PPI"
        primary_transform: yoy_pct
        tags: [healthcare]
      - id: PCU325412325412
        label: "Pharma preparation mfg PPI"
        primary_transform: yoy_pct
        tags: [healthcare]
      - id: PCU339112339112
        label: "Surgical & medical instruments PPI"
        primary_transform: yoy_pct
        tags: [healthcare]
      - id: PCU621210621210
        label: "Dentist offices PPI"
        primary_transform: yoy_pct
        tags: [healthcare]

    context:
      anchor_series: PPIFIS
      anchor_transform: annualized_mom
      trends:
        - {window_months: 3, stat: annualized_mom, label: "3mo annualized"}
        - {window_months: 6, stat: annualized_mom, label: "6mo annualized"}
      zscore_lookback_years: 5
      zscore_kind: delta

    charts:
      main:
        type: line
        lookback_years: 5
        series:
          - {id: PPIFIS, transform: yoy_pct, label: "Headline YoY"}
          - {id: PPIFES, transform: yoy_pct, label: "Core YoY"}
        highlight_latest: true
        filename: "ppi_5y_{period}.png"

      thread:
        - name: long_history
          type: line
          lookback_years: 25
          series:
