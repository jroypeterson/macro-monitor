          lookback_years: 10
          series:
            - {id: PCU622622,       transform: yoy_pct, label: "Hospitals"}
            - {id: PCU621111621111, transform: yoy_pct, label: "Physician offices"}
            - {id: PCU325412325412, transform: yoy_pct, label: "Pharma mfg"}
