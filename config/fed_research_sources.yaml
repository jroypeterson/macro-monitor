# Fed / macro research RSS source allowlist.
#
# Daily scan polls each source, dedupes against state/research_posted.db
# (URL-keyed), and posts a single "🏛️ NEW MACRO RESEARCH (N)" digest to
# #macro when N >= 1.
#
# Sources are intentionally narrow at v1 — high-signal, low-volume feeds
# where editorial curation has already filtered out the noise. URLs
# verified against live feeds on 2026-05-29. The plan (§8 Phase 2)
# considers adding Brookings/Hutchins and PIIE later if the digest reads
# thin; for now their feeds carry too much non-macro content. BIS
# doesn't publish a public RSS feed (404s on every candidate URL).

sources:
  - id: nber
    display_name: "NBER Working Papers"
    url: "https://www.nber.org/rss/new.xml"
    max_items_per_run: 8

  - id: ny_fed_liberty_street
    display_name: "NY Fed — Liberty Street Economics"
    url: "https://libertystreeteconomics.newyorkfed.org/feed/"
    max_items_per_run: 5

  - id: sf_fed_econ_letter
    display_name: "SF Fed — Economic Letter"
    url: "https://www.frbsf.org/feed/?post_type=economic-letter"
    max_items_per_run: 3

  - id: stlouis_fed_on_economy
    display_name: "St. Louis Fed — On the Economy"
    url: "https://www.stlouisfed.org/on-the-economy/rss.xml"
    max_items_per_run: 5

  - id: federal_reserve_board_feds
    display_name: "Federal Reserve Board — FEDS Working Papers"
    url: "https://www.federalreserve.gov/feeds/feds.xml"
    max_items_per_run: 5

  # === Macro commentary / market context ===
  # Lower-academic, higher-frequency. Mixed signal but each is well-curated.

  - id: calculated_risk
    display_name: "Calculated Risk (Bill McBride)"
    url: "https://www.calculatedriskblog.com/feeds/posts/default"
    max_items_per_run: 5

  - id: conversable_economist
    display_name: "Conversable Economist (Tim Taylor)"
    url: "https://conversableeconomist.com/feed/"
    max_items_per_run: 3

  # === Mainstream macro / business (headlines + dek; full text often gated) ===
  # Macro-specific feeds when the publication offers one; broader feeds
  # (WSJ) get tight include_keywords filters to drop non-macro items.

  - id: nyt_economy
    display_name: "NYT — Economy"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml"
    max_items_per_run: 5

  - id: nyt_upshot
    display_name: "NYT — The Upshot"
    url: "https://rss.nytimes.com/services/xml/rss/nyt/Upshot.xml"
    max_items_per_run: 3
    # Upshot is heavy on politics polling — keep only macro-shaped analysis
    include_keywords:
      - inflation
      - economy
      - economic
      - jobs
      - labor
      - wages
      - housing
      - growth
      - recession
      - fed
      - interest rate
      - monetary
      - gdp
      - trade
      - tariff
      - mortgage
      - consumer
      - household

  - id: ft_economics
    display_name: "FT — Global Economy"
    url: "https://www.ft.com/economics?format=rss"
    max_items_per_run: 5

  - id: ft_markets
    display_name: "FT — Markets"
    url: "https://www.ft.com/markets?format=rss"
    max_items_per_run: 4
    # FT Markets covers individual stocks too — filter to macro/rates/Fed
    include_keywords:
      - fed
      - rate
      - rates
      - inflation
      - cpi
      - pce
      - gdp
      - growth
      - recession
      - yield
      - treasury
      - bond
      - currency
      - dollar
      - economy
      - economic
      - central bank
      - ecb
      - boj
      - bank of england
      - bank of japan
      - pboc
      - monetary
      - fiscal
      - labor market
      - unemployment
      - employment
      - wages
      - housing

  - id: economist_finance_economics
    display_name: "The Economist — Finance & Economics"
    url: "https://www.economist.com/finance-and-economics/rss.xml"
    max_items_per_run: 5

  - id: bloomberg_economics
    display_name: "Bloomberg — Economics"
    url: "https://feeds.bloomberg.com/economics/news.rss"
    max_items_per_run: 5
    # Bloomberg Economics RSS includes some geopolitics/military framed
    # as econ stories — drop those.
    exclude_keywords:
      - war
      - missile
      - military
      - admiral
      - troops
      - sanctions on
      - airstrike
      - drone strike

  - id: bloomberg_markets
    display_name: "Bloomberg — Markets"
    url: "https://feeds.bloomberg.com/markets/news.rss"
    max_items_per_run: 4
    # Bloomberg Markets covers credit, IPOs, M&A — drop non-macro coverage
    include_keywords:
      - fed
      - rate
      - rates
      - inflation
      - cpi
      - pce
      - gdp
      - growth
      - recession
      - yield
      - treasury
      - bond
      - currency
      - dollar
      - euro
      - yen
      - economy
      - economic
      - central bank
      - ecb
      - boj
      - pboc
      - monetary
      - fiscal
      - labor market
      - unemployment
      - employment
      - wages
      - housing
      - jobs
      - powell

  - id: wsj_markets
    display_name: "WSJ — Markets"
    url: "https://feeds.a.dj.com/rss/RSSMarketsMain.xml"
    max_items_per_run: 4
    # WSJ Markets includes a lot of corporate finance / IPO / individual
    # stocks — keep only macro-shaped items.
    include_keywords:
      - fed
      - rate
      - rates
      - inflation
      - cpi
      - pce
      - gdp
      - growth
      - recession
      - yield
      - treasury
      - treasuries
      - bond
      - currency
      - dollar
      - economy
      - economic
      - central bank
      - ecb
      - boj
      - pboc
      - monetary
      - fiscal
      - labor market
      - unemployment
      - employment
      - wages
      - housing
      - jobs
      - powell
      - mortgage

  - id: wsj_us_business
    display_name: "WSJ — US Business"
    url: "https://feeds.a.dj.com/rss/WSJcomUSBusiness.xml"
    max_items_per_run: 3
    # Same filter as WSJ Markets.
    include_keywords:
      - fed
      - rate
      - rates
      - inflation
      - cpi
      - pce
      - gdp
      - growth
      - recession
      - yield
      - treasury
      - bond
      - currency
      - dollar
      - economy
      - economic
      - central bank
      - monetary
      - fiscal
      - labor market
      - unemployment
      - employment
      - wages
      - housing
      - jobs
      - powell

# Gmail-delivered research from senders without a public RSS feed.
# Uses jroypeterson@gmail.com OAuth token (shared with portfolio_daily +
# earnings_agent). Dedupes by Gmail message-id in research_posted.db.
#
# Query syntax: standard Gmail search. Common patterns:
#   from:<address>         — exact sender
#   from:<domain>          — any sender at a domain
#   from:"Display Name"    — match the From-line display name
#   subject:<word>         — narrow by subject line
#
# `newer_than_days` bounds the lookback window per run (defaults to 7).
# `max_items_per_run` caps the digest from any single sender.
gmail_senders:
  - id: torsten_slok
    display_name: "Torsten Slok / Apollo"
    query: "from:agm@apollo.com"
    max_items_per_run: 3
    newer_than_days: 7

  - id: yardeni
    display_name: "Yardeni Research QuickTakes"
    query: "from:yardeni-research@ghost.io"
    max_items_per_run: 3
    newer_than_days: 7

  - id: economist_today
    display_name: "The Economist Today"
    query: "from:newsletters@e.economist.com"
    max_items_per_run: 2
    newer_than_days: 5

