# International macro series — Phase 2 "Global macro" layer.
# Each entry: region + indicator + source + source-specific `params` locator.
# Sources: eurostat | ecb | oecd | ons | boe | estat | boj
# Periods normalize to YYYY-MM / YYYY-Qn / YYYY / YYYY-MM-DD.

series:
  # ───────────────────────── Eurozone (Eurostat + ECB) ────────────────────
  - id: ez_cpi
    region: eurozone
    indicator: cpi_yoy
    label: HICP all-items (YoY)
    source: eurostat
    freq: monthly
    params:
      dataset: prc_hicp_manr
      filters: {coicop: CP00, geo: EA20}

  - id: ez_core_cpi
    region: eurozone
    indicator: core_cpi_yoy
    label: HICP ex energy, food, alcohol & tobacco (YoY)
    source: eurostat
    freq: monthly
    params:
      dataset: prc_hicp_manr
      filters: {coicop: TOT_X_NRG_FOOD, geo: EA20}

  - id: ez_gdp
    region: eurozone
    indicator: gdp_yoy
    label: Real GDP (YoY)
    source: eurostat
    freq: quarterly
    params:
      dataset: namq_10_gdp
      filters: {unit: CLV_PCH_SM, s_adj: SCA, na_item: B1GQ, geo: EA20}

  - id: ez_unemp
    region: eurozone
    indicator: unemployment
    label: Unemployment rate
    source: eurostat
    freq: monthly
    params:
      dataset: une_rt_m
      filters: {unit: PC_ACT, s_adj: SA, age: TOTAL, sex: T, geo: EA21}

  - id: ez_rate
    region: eurozone
    indicator: policy_rate
    label: ECB main refinancing rate
    source: ecb
    freq: daily
    decimals: 2
    params:
      flow: FM
      key: B.U2.EUR.4F.KR.MRR_FR.LEV

  - id: ez_yield_2y
    region: eurozone
    indicator: yield_2y
    label: 2Y euro-area AAA yield
    source: ecb
    freq: daily
    decimals: 2
    params:
      flow: YC
      key: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_2Y
      start: "2025-12-01"

  - id: ez_yield_10y
    region: eurozone
    indicator: yield_10y
    label: 10Y euro-area AAA yield
    source: ecb
    freq: daily
    decimals: 2
    params:
      flow: YC
      key: B.U2.EUR.4F.G_N_A.SV_C_YM.SR_10Y
      start: "2025-12-01"

  # ───────────────────────── United Kingdom (ONS + BoE) ───────────────────
  - id: uk_cpi
    region: uk
    indicator: cpi_yoy
    label: CPI all-items (YoY)
    source: ons
    freq: monthly
    params:
      url: https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/d7g7/mm23/data

  - id: uk_core_cpi
    region: uk
    indicator: core_cpi_yoy
    label: Core CPI ex energy, food, alcohol & tobacco (YoY)
    source: ons
    freq: monthly
    params:
      url: https://www.ons.gov.uk/economy/inflationandpriceindices/timeseries/dko8/mm23/data

  - id: uk_gdp
    region: uk
    indicator: gdp_yoy
    label: Real GDP (YoY)
    source: ons
    freq: quarterly
    params:
      url: https://www.ons.gov.uk/economy/grossdomesticproductgdp/timeseries/ihyr/qna/data

  - id: uk_unemp
    region: uk
    indicator: unemployment
    label: Unemployment rate (16+)
    source: ons
    freq: monthly
    params:
      url: https://www.ons.gov.uk/employmentandlabourmarket/peoplenotinwork/unemployment/timeseries/mgsx/lms/data

  - id: uk_rate
    region: uk
    indicator: policy_rate
    label: BoE Bank Rate
    source: boe
    freq: daily
    decimals: 2
    params:
      series: IUDBEDR

  - id: uk_yield_10y
    region: uk
    indicator: yield_10y
    label: 10Y gilt (nominal par)
    source: boe
    freq: daily
    decimals: 2
    params:
      series: IUDMNPY     # British Gov't Securities 10Y nominal par yield
      from: "01/Dec/2025"
      collapse: false

  # ───────────────────────── China (OECD) ─────────────────────────────────
  - id: cn_cpi
    region: china
    indicator: cpi_yoy
    label: CPI all-items (YoY)
    source: oecd
    freq: monthly
    params:
      flow: "OECD.SDD.TPS,DSD_PRICES@DF_PRICES_ALL,1.0"
      key: CHN.M.N.CPI.PA._T.N.GY
      start: "2024-01"

  - id: cn_gdp
    region: china
    indicator: gdp_yoy
    label: Real GDP (YoY)
    source: oecd
    freq: quarterly
    params:
      # Quarterly real GDP growth - G20 countries; TRANSFORMATION=GY (YoY).
      flow: "OECD.SDD.NAD,DSD_NAMAIN1@DF_QNA_EXPENDITURE_GROWTH_G20,1.1"
      key: Q..CHN.........GY.
      start: "2023-Q1"

  # ───────────────────────── Japan (e-Stat gated + OECD rate) ─────────────
  # Japan CPI/GDP need ESTAT_APP_ID in .env (see sources/estat.py). Until the
  # key is added these rows surface as "unavailable" in the digest.
  - id: jp_cpi
    region: japan
    indicator: cpi_yoy
    label: CPI all-items (YoY)
    source: estat
    freq: monthly
    params:
      # CPI 2020-base all-items INDEX (all-Japan); collector derives YoY.
      statsDataId: "0003427113"
      filters: {cdCat01: "0001"}
      limit: 30
      transform: yoy_pct

  - id: jp_rate
    region: japan
    indicator: policy_rate
    label: BoJ policy rate (call money, monthly avg)
    # BoJ has no clean keyless by-code endpoint; FRED's call-money rate is
    # the reliable proxy (see sources/boj.py for why native is deferred).
    source: fred
    freq: monthly
    decimals: 2
    params:
      series: IRSTCI01JPM156N

  - id: jp_yield_10y
    region: japan
    indicator: yield_10y
    label: 10Y JGB
    source: fred
    freq: monthly
    decimals: 2
    params:
      series: IRLTLT01JPM156N
