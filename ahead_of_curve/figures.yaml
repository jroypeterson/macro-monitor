# Ahead of the Curve — chart specs. Each figure is rendered to a PNG by charts.py.
# Phase 2 MVP: the 5 marquee charts that carry Ellis's thesis. Add the remaining
# ~15 book figures here over time (config edit, no code change).
#
# Per-series fields:
#   fred       — FRED series id (required)
#   label      — legend label (required)
#   transform  — 'yoy' (year-over-year rate of change, the Ellis lens),
#                'yoy_accel' (rate of change OF the YoY — 12-mo change in the growth
#                rate, in percentage points; +ve = accelerating), or 'raw' (level)
#   divide_by  — optional FRED id to deflate by (real = nominal / deflator) BEFORE transform
# Per-figure fields:
#   bands      — 'bear' (curated bear_markets.yaml), 'recession' (FRED USREC), 'both', or 'none'
#   lookback_years — window length (defaults to global default_lookback_years)

default_lookback_years: 55
source_note: "Source: FRED (BEA, BLS, Federal Reserve). Real series = nominal / deflator. Bands = S&P 500 bear markets. Recreation of charts from \"Ahead of the Curve\" (Joseph Ellis)."

# Real series are derived nominal/deflator (the book's own definition) so the
# history runs to 1959+, not the short current vintage of FRED's chained-dollar
# series (PCEC96/PNFIC1 only start 2007). real PCE = PCE/PCEPI; real capex = PNFI/GDPDEF.
figures:
  - id: real_pce_yoy
    title: "Real Consumer Spending (PCE), Year-over-Year"
    subtitle: "The leading indicator: real PCE growth peaks and rolls over ahead of bear markets."
    bands: both
    series:
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}

  - id: pce_accel
    title: "Real Consumer Spending — Acceleration"
    subtitle: "Rate of change of the real PCE YoY growth rate (12-month change, in percentage points = pp). Above zero = accelerating; below = decelerating."
    bands: both
    series:
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE growth — Δ (pp)", transform: yoy_accel}

  - id: pce_leads_capex
    title: "Consumer Spending Leads Capital Spending"
    subtitle: "Real business capex (YoY) follows real PCE (YoY) with a lag — the book's core lead/lag."
    bands: both
    series:
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}
      - {fred: PNFI, divide_by: GDPDEF, label: "Real Business Capex (YoY)", transform: yoy}

  - id: capex_accel
    title: "Real Capital Spending — Acceleration"
    subtitle: "Rate of change of the real business-capex YoY growth rate (12-month change, in percentage points = pp). Above zero = accelerating; below = decelerating."
    bands: both
    series:
      - {fred: PNFI, divide_by: GDPDEF, label: "Real capex growth — Δ (pp)", transform: yoy_accel}

  - id: pce_vs_employment
    title: "Consumer Spending and Employment"
    subtitle: "Employment growth (YoY) tracks and follows real consumer spending."
    bands: both
    series:
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}
      - {fred: CE16OV, label: "Civilian Employment (YoY)", transform: yoy}

  - id: employment_wages_spending
    title: "Employment, Wage Growth and Consumer Spending"
    subtitle: "Employment (YoY) and real hourly earnings (YoY) drive real consumer spending (YoY). Book Fig 11-11."
    bands: both
    series:
      - {fred: CE16OV, label: "Civilian Employment (YoY)", transform: yoy}
      - {fred: AHETPI, divide_by: CPIAUCSL, label: "Real Avg Hourly Earnings (YoY)", transform: yoy}
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}

  - id: real_earnings_vs_spending
    title: "Real Hourly Earnings and Consumer Spending"
    subtitle: "Real average hourly earnings (AHETPI deflated by CPI), YoY, vs real PCE."
    bands: both
    series:
      - {fred: AHETPI, divide_by: CPIAUCSL, label: "Real Avg Hourly Earnings (YoY)", transform: yoy}
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}

  - id: earnings_accel
    title: "Real Hourly Earnings — Acceleration"
    subtitle: "Rate of change of the real-hourly-earnings YoY growth rate (12-month change, in percentage points = pp). Above zero = accelerating; below = decelerating."
    bands: both
    series:
      - {fred: AHETPI, divide_by: CPIAUCSL, label: "Real earnings growth — Δ (pp)", transform: yoy_accel}

  - id: rates_vs_bears
    title: "Interest Rates and Bear Markets"
    subtitle: "Fed funds and the 10-year Treasury (levels) against the bear-market record."
    bands: both
    series:
      - {fred: FEDFUNDS, label: "Fed Funds Rate", transform: raw}
      - {fred: GS10, label: "10-Year Treasury", transform: raw}

  # ---- Phase 3: more of the book's figures (FRED-doable; S&P-overlay figures
  #      4-1/10-10/13-3 deferred pending a long S&P 500 history source). ----

  - id: real_gdp_yoy
    title: "Economic Growth and the Cycle"
    subtitle: "Real GDP (YoY) = nominal GDP deflated by the GDP deflator. Book Fig 4-1."
    bands: both
    series:
      - {fred: GDP, divide_by: GDPDEF, label: "Real GDP (YoY)", transform: yoy}

  - id: pce_vs_industrial_production
    title: "Consumer Spending and Industrial Production"
    subtitle: "Industrial production (YoY) is a coincident output read that follows real PCE. Book Fig 7-3."
    bands: both
    series:
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}
      - {fred: IPMAN, label: "Industrial Production — mfg (YoY)", transform: yoy}

  - id: industrial_production_vs_capex
    title: "Industrial Production and Capital Spending"
    subtitle: "Output and business investment (both YoY) move together through the cycle. Book Fig 7-5."
    bands: both
    series:
      - {fred: IPMAN, label: "Industrial Production — mfg (YoY)", transform: yoy}
      - {fred: PNFI, divide_by: GDPDEF, label: "Real Business Capex (YoY)", transform: yoy}

  - id: real_earnings_vs_inflation
    title: "Inflation and Real Hourly Earnings"
    subtitle: "Real hourly earnings (YoY) vs CPI inflation (YoY) — inflation eats into real wage growth. Book Fig 10-4."
    bands: both
    series:
      - {fred: AHETPI, divide_by: CPIAUCSL, label: "Real Avg Hourly Earnings (YoY)", transform: yoy}
      - {fred: CPIAUCSL, label: "CPI Inflation (YoY)", transform: yoy}

  - id: employment_borrowing_earnings
    title: "Employment, Borrowing and Hourly Earnings"
    subtitle: "Employment, total domestic debt, and real hourly earnings (all YoY). Book Fig 10-9."
    bands: both
    series:
      - {fred: CE16OV, label: "Civilian Employment (YoY)", transform: yoy}
      - {fred: TCMDO, label: "Total Domestic Debt (YoY)", transform: yoy}
      - {fred: AHETPI, divide_by: CPIAUCSL, label: "Real Avg Hourly Earnings (YoY)", transform: yoy}

  - id: consumer_sentiment
    title: "Consumer Sentiment"
    subtitle: "University of Michigan Index of Consumer Sentiment (level, 1966Q1=100). Book Fig 9-3."
    bands: both
    series:
      - {fred: UMCSENT, label: "U. Michigan Consumer Sentiment", transform: raw, unit: index}

  - id: saving_rate
    title: "The Saving Rate"
    subtitle: "Personal saving as a share of disposable income (level). Book Supplemental figure."
    bands: both
    series:
      - {fred: PSAVERT, label: "Personal Saving Rate", transform: raw}

  - id: unemployment_vs_bears
    title: "Unemployment and Bear Markets"
    subtitle: "The unemployment rate (level) against the bear-market and recession record. Book Fig 11-8."
    bands: both
    series:
      - {fred: UNRATE, label: "Unemployment Rate", transform: raw}

  - id: unemployment_vs_spending
    title: "Unemployment and Consumer Spending"
    subtitle: "Real PCE growth (YoY, left axis) vs the unemployment rate (level, right axis). Book Fig 11-6."
    bands: both
    series:
      - {fred: PCE, divide_by: PCEPI, label: "Real PCE (YoY)", transform: yoy}
      - {fred: UNRATE, label: "Unemployment Rate (right)", transform: raw, axis: right}

  - id: inflation_vs_rates
    title: "Inflation and Interest Rates"
    subtitle: "CPI inflation (YoY) vs the 10-year Treasury yield (level). Book Fig 12-4."
    bands: both
    series:
      - {fred: CPIAUCSL, label: "CPI Inflation (YoY)", transform: yoy}
      - {fred: GS10, label: "10-Year Treasury", transform: raw}

  # ---- S&P 500 overlay figures (dual-axis; S&P 500 level on the right, log scale).
  #      S&P history is yfinance ^GSPC (daily resampled to monthly, back to ~1928). ----

  - id: growth_and_stock_market
    title: "Economic Growth, Recessions and the Stock Market"
    subtitle: "Real GDP growth (YoY, left axis) and the S&P 500 (level, log, right axis). Book Fig 4-1."
    bands: both
    series:
      - {fred: GDP, divide_by: GDPDEF, label: "Real GDP (YoY)", transform: yoy}
      - {fred: GSPC, label: "S&P 500 (right, log)", transform: raw, unit: level, axis: right, scale: log}

  - id: real_earnings_and_stock_market
    title: "Real Hourly Earnings and the Stock Market"
    subtitle: "Real hourly earnings (YoY, left axis) vs the S&P 500 (level, log, right axis). Book Fig 10-10."
    bands: both
    series:
      - {fred: AHETPI, divide_by: CPIAUCSL, label: "Real Avg Hourly Earnings (YoY)", transform: yoy}
      - {fred: GSPC, label: "S&P 500 (right, log)", transform: raw, unit: level, axis: right, scale: log}

  - id: long_rates_and_stock_market
    title: "Long-Term Interest Rates and the Stock Market"
    subtitle: "10-year Treasury yield (level, left axis) and the S&P 500 (level, log, right axis). Book Fig 13-3."
    bands: both
    series:
      - {fred: GS10, label: "10-Year Treasury", transform: raw}
      - {fred: GSPC, label: "S&P 500 (right, log)", transform: raw, unit: level, axis: right, scale: log}

  # ---- Reference: a bands-only timeline of every bear market + recession,
  #      as far back as the data go (NBER recessions reach to the 1850s). ----
  - id: bear_recession_timeline
    title: "U.S. Bear Markets and Recessions — Timeline"
    subtitle: "Reference: every S&P 500 bear market (grey) and NBER recession (dotted red), as far back as the data go. No economic series — just the cycle backdrop."
    bands: both
    series: []
