# S&P 500 major bear markets — peak-to-trough declines of roughly >=20%.
# Curated to match the book's treatment (Ellis shades BEAR MARKETS behind the YoY
# lines, which lead/differ from NBER recessions). Month granularity is plenty for
# the band overlay. Used by charts.py to draw shaded axvspan bands.
#
# The secondary NBER recession-band toggle pulls live from FRED USREC instead
# (see charts.py _recession_ranges); this file is the PRIMARY (bear) overlay.

bear_markets:
  - {start: 1968-12, end: 1970-05, name: "1968-70"}
  - {start: 1973-01, end: 1974-10, name: "1973-74"}
  - {start: 1980-11, end: 1982-08, name: "1980-82"}
  - {start: 1987-08, end: 1987-12, name: "1987"}
  - {start: 1990-07, end: 1990-10, name: "1990"}
  - {start: 2000-03, end: 2002-10, name: "2000-02 dot-com"}
  - {start: 2007-10, end: 2009-03, name: "2007-09 GFC"}
  - {start: 2020-02, end: 2020-03, name: "2020 COVID"}
  - {start: 2022-01, end: 2022-10, name: "2022"}
